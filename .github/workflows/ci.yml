name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint (flake8)
        run: flake8 banking_api/

      - name: Type check (mypy)
        run: mypy banking_api/

      - name: Unit tests (pytest)
        run: pytest tests/unit/ --cov=banking_api --cov-report=xml

      - name: Feature tests (unittest)
        run: python -m unittest discover tests/features

      - name: Build package
        run: python -m build
