name: Python Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      # 1. Checkout du repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configuration de Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Cache pip
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Installation des dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Création des fichiers simulés pour les tests
      - name: Create dummy data for tests
        run: |
          mkdir -p app/data/dataset
          echo "id" > app/data/dataset/cards_data.csv
          echo "id" > app/data/dataset/users_data.csv
          echo "id" > app/data/dataset/transactions_data.csv
          echo "{}" > app/data/dataset/mcc_codes.json
          echo "{}" > app/data/dataset/train_fraud_labels.json
          echo "Fichiers simulés créés avec succès."

      # 8. Exécution des tests
      - name: Run tests
        run: pytest -v
