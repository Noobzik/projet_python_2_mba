[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-api"
version = "1.0.0"
description = "Banking Transactions API - ESG MBA Project"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ESG MBA Group" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[project.scripts]
banking-api = "banking_api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["banking_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=banking_api --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
